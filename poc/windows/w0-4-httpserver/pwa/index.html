<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="/manifest.json">
<title>Kallr PoC W6</title>
</head>
<body>
<h1>Kallr PoC W6</h1>
<p>this origin: <code id="o"></code></p>
<label>API base <input id="base" value="http://127.0.0.1:8765" size="30"></label><br>
<label>at (JST) <input id="at" size="20"></label>
<button id="add">POST /schedules</button>
<button id="list">GET /schedules</button>
<pre id="log"></pre>
<script>
const $ = (id) => document.getElementById(id);
$('o').textContent = location.origin;
const pad = (n) => String(n).padStart(2, '0');
// Shift by +9h and read UTC fields so the value is JST regardless of the browser timezone.
const d = new Date(Date.now() + 90000 + 9 * 3600000);
$('at').value = `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())} ${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}`;
const log = (m) => { $('log').textContent += m + '\n'; };
async function call(method, body) {
  try {
    const r = await fetch($('base').value + '/schedules', {
      method, headers: body ? { 'content-type': 'application/json' } : {}, body: body && JSON.stringify(body),
    });
    log(`${method} -> ${r.status} ${await r.text()}`);
  } catch (e) {
    // CORS / PNA / LNA blocks and "server not running" both surface as TypeError here; the console distinguishes them.
    log(`${method} -> ${e.name}: ${e.message}`);
  }
}
$('add').onclick = () => call('POST', { at: $('at').value, title: 'PoC W6 from ' + location.origin, batch: 'W6', alarm: String(Date.now()) });
$('list').onclick = () => call('GET');
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
</script>
</body>
</html>
